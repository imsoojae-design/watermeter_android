name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Install Gradle 8.4
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
        unzip -q gradle-8.4-bin.zip -d /opt/gradle
        echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH
    - name: Build APK
      run: |
        chmod +x gradlew
        gradle assembleDebug --no-daemon
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/meter-simulator.apk
    - uses: actions/upload-artifact@v4
      with:
        name: MeterSimulator-Android
        path: app/build/outputs/apk/debug/meter-simulator.apk
        retention-days: 30
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0
        name: "계량기 시뮬레이터 Android v1.0"
        files: app/build/outputs/apk/debug/meter-simulator.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
